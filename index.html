<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text2: #6c6c70;
    --text3: #aeaeb2;
    --border: rgba(0,0,0,0.08);
    --yellow: #ffd60a;
    --yellow-dark: #a68800;
    --yellow-bg: rgba(255,214,10,0.12);
    --red: #ff3b30;
    --red-bg: rgba(255,59,48,0.08);
    --radius: 14px;
    --radius-sm: 10px;
    --font: -apple-system, 'SF Pro Display', BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --text: #f2f2f7;
      --text2: #aeaeb2;
      --text3: #636366;
      --border: rgba(255,255,255,0.08);
      --yellow-bg: rgba(255,214,10,0.1);
      --red-bg: rgba(255,59,48,0.12);
    }
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 0;
  }

  .app {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 16px 40px;
    flex: 1;
  }

  .header {
    padding: 0 4px 18px;
  }

  .header-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  h1 {
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .note-count {
    font-size: 13px;
    color: var(--text3);
    margin-top: 4px;
    font-weight: 400;
  }

  .add-row {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
    border: 0.5px solid var(--border);
  }

  .add-row input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: 16px;
    color: var(--text);
    outline: none;
    caret-color: var(--yellow);
  }

  .add-row input::placeholder { color: var(--text3); }

  .btn-add {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--yellow);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.12s, opacity 0.12s;
  }

  .btn-add:active { transform: scale(0.88); opacity: 0.75; }

  .btn-add svg { width: 16px; height: 16px; stroke: #1c1c1e; stroke-width: 2.5; }

  .list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .note {
    background: var(--card);
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    animation: slideDown 0.2s ease;
    overflow: hidden;
    transition: opacity 0.15s, transform 0.15s;
  }

  .note:first-child { border-radius: var(--radius) var(--radius) var(--radius-sm) var(--radius-sm); }
  .note:last-child  { border-radius: var(--radius-sm) var(--radius-sm) var(--radius) var(--radius); }
  .note:only-child  { border-radius: var(--radius); }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .note-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--yellow-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .note-icon svg { width: 16px; height: 16px; stroke: var(--yellow-dark); stroke-width: 1.8; fill: none; }

  @media (prefers-color-scheme: dark) {
    .note-icon svg { stroke: var(--yellow); }
  }

  .note-body { flex: 1; min-width: 0; }

  .note-text {
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.45;
    word-break: break-word;
  }

  .note-time {
    font-size: 12px;
    color: var(--text3);
    margin-top: 3px;
  }

  .btn-del {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text3);
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .btn-del:hover { background: var(--red-bg); color: var(--red); }
  .btn-del svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.2; }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text3);
    font-size: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .empty svg { width: 40px; height: 40px; stroke: var(--text3); stroke-width: 1.2; fill: none; opacity: 0.5; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <h1>Notas</h1>
    </div>
    <p class="note-count" id="count">0 notas</p>
  </div>

  <div class="add-row">
    <input type="text" id="input" placeholder="Nova nota..." maxlength="300" />
    <button class="btn-add" onclick="add()" aria-label="Adicionar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const KEY = 'ios-notes-v1';
let notes = JSON.parse(localStorage.getItem(KEY) || '[]');
let nid = notes.length ? Math.max(...notes.map(n => n.id)) + 1 : 1;

function save() { localStorage.setItem(KEY, JSON.stringify(notes)); }

function timeStr() {
  return new Date().toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  count.textContent = notes.length === 1 ? '1 nota' : notes.length + ' notas';
  list.innerHTML = '';

  if (notes.length === 0) {
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="14" y2="12"/><line x1="7" y1="16" x2="11" y2="16"/></svg>
      <span>Nenhuma nota ainda</span>
    </div>`;
    return;
  }

  notes.forEach((n, i) => {
    const div = document.createElement('div');
    div.className = 'note';
    div.dataset.id = n.id;
    div.innerHTML = `
      <div class="note-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="14" y2="12"/><line x1="7" y1="16" x2="11" y2="16"/></svg>
      </div>
      <div class="note-body">
        <div class="note-text">${escHtml(n.text)}</div>
        <div class="note-time">${n.time}</div>
      </div>
      <button class="btn-del" onclick="remove(${n.id})" aria-label="Remover">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    list.appendChild(div);
  });
}

function add() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  notes.unshift({ id: nid++, text, time: timeStr() });
  save(); render();
  input.value = '';
  input.focus();
}

function remove(id) {
  const el = document.querySelector(`.note[data-id="${id}"]`);
  if (el) {
    el.style.opacity = '0';
    el.style.transform = 'translateX(16px)';
    setTimeout(() => {
      notes = notes.filter(n => n.id !== id);
      save(); render();
    }, 150);
  }
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter') add();
});

render();
</script>
</body>
</html>
